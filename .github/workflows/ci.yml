name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Locked mode fails the build if packages.lock.json is out of date, so the
      # exact transitive dependency graph is what actually gets built.
      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test tests/Vwm.Core.Tests/Vwm.Core.Tests.csproj -c Release --no-build --verbosity normal
